name: Quick Test Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths-ignore:
      - "README.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: write

jobs:
  build_quick:
    name: Quick Universal Release Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Init metroproto submodule
        run: git submodule update --init metroproto

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Setup and Generate Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (No Lint)
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary -x lint -x lintFossRelease
        env:
          METROLIST_APPLICATION_ID: com.sleep.app.test
          METROLIST_APP_NAME: Sleep Testing
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Sign APK
        if: env.ANDROID_SIGNING_KEY != ''
        uses: ilharp/sign-android-release@v2.0.0
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY || secrets.KEYSTORE }}
        with:
          releaseDirectory: app/build/outputs/apk/foss/release/
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY || secrets.KEYSTORE }}
          alias: ${{ secrets.KEY_ALIAS || secrets.ALIAS }}
          keyAlias: ${{ secrets.KEY_ALIAS || secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Move APK
        run: |
          OUTPUT_DIR="app/build/outputs/apk/foss/release"
          mkdir -p "$OUTPUT_DIR/out"
          APK=$(find "$OUTPUT_DIR" -maxdepth 1 -name "*-signed.apk" -o -name "*-unsigned-signed.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find "$OUTPUT_DIR" -maxdepth 1 -name "*.apk" | head -1)
          fi
          if [ -n "$APK" ]; then
            mv "$APK" "$OUTPUT_DIR/out/app-universal-test-release.apk"
            echo "Moved $APK to $OUTPUT_DIR/out/app-universal-test-release.apk"
          else
            echo "No APK found in $OUTPUT_DIR"
            ls -la "$OUTPUT_DIR"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-universal-test-release
          path: app/build/outputs/apk/foss/release/out/*
